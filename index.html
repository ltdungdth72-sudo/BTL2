    <script>
      // Defensive guard against browser extensions trying to override window.fetch
      (function() {
        try {
          var originalFetch = window.fetch;
          var customFetch = originalFetch;
          Object.defineProperty(window, 'fetch', {
            get: function() {
              return customFetch;
            },
            set: function(fn) {
              customFetch = fn;
            },
            configurable: true,
            enumerable: true
          });
        } catch (e) {}

        // Suppress external chrome-extension errors from halting app execution
        window.addEventListener('error', function(event) {
          if (event.filename && event.filename.indexOf('chrome-extension://') !== -1) {
            event.preventDefault();
            event.stopPropagation();
            return true;
          }
        }, true);

        window.addEventListener('unhandledrejection', function(event) {
          if (event.reason && String(event.reason.stack || event.reason).indexOf('chrome-extension://') !== -1) {
            event.preventDefault();
            event.stopPropagation();
          }
        }, true);
      })();
    </script>
